[project]
name = "pypi-ecosystem-pipeline"
version = "0.1.0"
description = "API-to-insight data pipeline: resilient crawling of the PyPI JSON API, medallion modelling, quality gates and an ecosystem report"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypipe = ["sql/*.sql"]
